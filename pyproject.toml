[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deutschlandfunk-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for Deutschlandfunk (deutschlandfunk.de) — news, topics, articles & live stream"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "httpx>=0.27",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
deutschlandfunk-mcp = "deutschlandfunk_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deutschlandfunk_mcp"]

[tool.pytest.ini_options]
markers = ["live: tests that hit the real https://www.deutschlandfunk.de site"]
